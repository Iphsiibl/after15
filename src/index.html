<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a33">
<meta name="description" content="下班后的十五分钟 —— 一个不需要你做任何决定的疗愈小程序。">

<body data-screen="lobby">
<div class="bg" aria-hidden="true"></div>

<header class="topbar">

</div>

<script>{{CONTENT_JS}}</script>
<script>{{AUDIO_JS}}</script>

</html>
