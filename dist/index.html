<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a33">
<meta name="description" content="下班后的十五分钟 —— 一个不需要你做任何决定的疗愈小程序。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151733'/%3E%3Cpath d='M40 14a18 18 0 1 0 10 32 15 15 0 0 1-10-32z' fill='%23ffc98a'/%3E%3Ccircle cx='17' cy='45' r='2' fill='%238fd6c0'/%3E%3C/svg%3E">
<title>下班后的十五分钟</title>
<style>/* ===========================================================
 * styles.css —— 《下班后的十五分钟》视觉系统
 * 基调: 黄昏的紫橘 → 深夜的靛蓝; 纸感颗粒; 圆角; 慢动效。
 * =========================================================== */

:root{
  --bg:#151733;
  --bg-2:#241f42;
  --ink:#f3f0ff;
  --ink-soft:rgba(243,240,255,.68);
  --ink-faint:rgba(243,240,255,.42);
  --warm:#ffc98a;
  --accent:#8fd6c0;
  --danger:#ff8f9c;
  --line:rgba(255,255,255,.14);
  --panel:rgba(255,255,255,.08);
  --screen:#2b3a58;
  --screen-line:#7ea6d8;
  --star:#ffe6b5;
  --quilt:#4b5a86;
  --pillow:#8fa0c8;
  --display:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --radius:20px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* 背景: 双色光晕 + 颗粒 */
.bg{
  position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(120% 70% at 78% 8%, rgba(255,170,110,.22), transparent 60%),
    radial-gradient(90% 60% at 12% 92%, rgba(110,140,255,.20), transparent 62%),
    linear-gradient(180deg,var(--bg-2) 0%, var(--bg) 46%, #10132a 100%);
  transition:background 1.2s ease;
}
.bg::after{
  content:"";position:absolute;inset:0;opacity:.05;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}

/* 顶栏 */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px 8px;max-width:760px;margin:0 auto;
}
.brand{font-size:13px;letter-spacing:.22em;color:var(--ink-faint);font-family:var(--display)}
.sound{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:17px;cursor:pointer;
  display:grid;place-items:center;transition:transform .2s ease,opacity .2s ease;
}
.sound:hover{transform:scale(1.06)}
.sound.off{opacity:.45}

/* 电量条 */
.meter{
  max-width:760px;margin:0 auto;padding:4px 22px 0;
  display:none;align-items:center;gap:12px;
}
body[data-screen="stage"] .meter,body[data-screen="result"] .meter{display:flex}
.meter-track{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden}
.meter-fill{
  height:100%;width:60%;border-radius:99px;
  background:linear-gradient(90deg,#ffd27a,#8fd6c0);
  transition:width .7s cubic-bezier(.2,.8,.2,1);
}
.meter-fill.low{background:linear-gradient(90deg,#ff9a76,#ff6f91)}
.meter-text{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;white-space:nowrap}

/* 舞台 */
.stage{max-width:760px;margin:0 auto;padding:14px 22px 64px}
.screen{min-height:60vh}

/* 注意: 不要用 fill-mode:both —— 动画结束后 transform 会停在 identity matrix,
   那样 .fade-in 就会变成 position:fixed 子元素的包含块, 卡片灯箱就铺不满屏幕了 */
.fade-in{animation:fadeIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- 大厅 ---------- */
.lobby{position:relative;text-align:left;padding-top:6vh}
.lobby-sky{
  position:absolute;inset:-40px -22px auto -22px;height:340px;z-index:-1;
  background:radial-gradient(60% 80% at 70% 10%, rgba(255,175,110,.30), transparent 70%);
  filter:blur(6px);
}
.clock{font-size:13px;letter-spacing:.3em;color:var(--warm);margin:0 0 10px}
.title{
  font-family:var(--display);font-weight:700;
  font-size:clamp(38px,9vw,62px);line-height:1.22;margin:0 0 18px;letter-spacing:.02em;
}
.title span{color:var(--warm)}
.lede{color:var(--ink-soft);font-size:16px;margin:0 0 30px;max-width:34em}
.lobby-actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}

.cta{
  font:inherit;font-size:16px;letter-spacing:.06em;
  padding:14px 30px;min-height:48px;border-radius:99px;border:1px solid transparent;
  background:linear-gradient(120deg,#ffcf92,#ffab74);color:#31213a;font-weight:600;
  cursor:pointer;transition:transform .2s ease,box-shadow .3s ease,filter .2s ease;
  box-shadow:0 10px 30px -12px rgba(255,170,110,.8);
}
.cta:hover{transform:translateY(-2px);filter:brightness(1.04)}
.cta:active{transform:translateY(0)}
.cta.next{margin-top:18px;background:linear-gradient(120deg,#a9e2cf,#7fc4e8);box-shadow:0 10px 30px -14px rgba(140,210,230,.8)}

.ghost{
  font:inherit;font-size:14px;color:var(--ink-soft);
  padding:12px 20px;min-height:44px;border-radius:99px;
  border:1px solid var(--line);background:transparent;cursor:pointer;
  transition:border-color .2s ease,color .2s ease,background .2s ease;
}
.ghost:hover{border-color:rgba(255,255,255,.34);color:var(--ink)}
.ghost.small{font-size:13px;padding:8px 14px;min-height:44px;color:var(--ink-faint)}

.micro{font-size:12.5px;color:var(--ink-faint);margin:18px 0 0;letter-spacing:.04em}
.music-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:22px 0 0}
.music-line .ghost{text-decoration:none}
.music-title{font-size:13px;letter-spacing:.14em;color:var(--ink-faint)}
.music-line audio{height:32px;max-width:260px;opacity:.8;filter:invert(92%) hue-rotate(180deg) saturate(.35)}

/* 给明天留一句话 */
.note{
  margin-top:14px;padding:16px;border-radius:16px;
  border:1px solid rgba(255,201,138,.28);background:rgba(255,201,138,.07);
}
.note-label{display:block;font-size:12px;letter-spacing:.12em;color:var(--warm);opacity:.9;margin-bottom:8px}
.note-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note-row input{
  flex:1 1 200px;min-height:44px;padding:8px 14px;border-radius:12px;
  border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--ink);
  font-family:var(--sans);font-size:15px;outline:none;transition:border-color .2s ease;
}
.note-row input:focus{border-color:rgba(255,201,138,.6)}
.note-row input::placeholder{color:var(--ink-faint)}
.note-hint{margin:8px 0 0;font-size:12px;color:var(--ink-faint)}
.note-card{
  margin-top:14px;padding:18px;border-radius:var(--radius);
  border:1px solid rgba(255,201,138,.3);background:rgba(255,201,138,.08);
  transition:opacity .6s ease,max-height .6s ease,padding .6s ease,margin .6s ease;
  overflow:hidden;max-height:320px;
}
.note-card.fold{opacity:0;max-height:0;padding-top:0;padding-bottom:0;margin-top:0;border-width:0}

.sign-card{
  margin-top:34px;padding:18px 20px;border-radius:var(--radius);
  border:1px solid var(--line);background:rgba(255,255,255,.05);max-width:34em;
}
.sign-label{font-size:11.5px;letter-spacing:.3em;color:var(--warm)}
.sign-text{font-family:var(--display);font-size:19px;line-height:1.7;margin:8px 0 6px}
.sign-tip{font-size:12.5px;color:var(--ink-faint)}

/* 大厅双栏：文字 + 黄昏窗景 */
.lobby-grid{display:grid;grid-template-columns:1fr;gap:30px;align-items:start}
.lobby-art-wrap{
  border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  box-shadow:0 30px 70px -34px rgba(0,0,0,.85);
}
.lobby-art{width:100%;height:auto;display:block}
@media (min-width:780px){
  .lobby{grid-template-columns:1fr}
  .lobby-grid{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:38px;align-items:center}
  .lobby-art-wrap{margin-top:10px}
}

/* ---------- 旅程 ---------- */
.stage-head{display:flex;align-items:baseline;gap:12px;margin:2px 0 12px}
.stage-time{font-size:13px;letter-spacing:.24em;color:var(--warm);font-variant-numeric:tabular-nums}
.stage-name{font-size:14px;color:var(--ink-soft)}
.stage-count{margin-left:auto;font-size:12px;color:var(--ink-faint);letter-spacing:.14em}

.scene-wrap{
  position:relative;border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);background:#1b1d33;
  aspect-ratio:5/3;margin-bottom:20px;
  transition:filter .8s ease,opacity .6s ease;
}
.scene-wrap.clickable{cursor:pointer}
.scene{width:100%;height:100%;display:block}

/* 场景状态 */
.scene-wrap.is-off{filter:brightness(.42) saturate(.7)}
.scene-wrap.is-off .monitor{transition:transform .6s ease,opacity .6s ease;transform:translateY(-6px) scale(.99);opacity:.75}
.scene-wrap.is-off .steam{opacity:0;transition:opacity 1s ease}
.scene-wrap.warm{filter:brightness(1.06) saturate(1.1) hue-rotate(-6deg)}
.scene-wrap.warm .cup-steam{opacity:1;animation:steam 2.6s ease-in-out infinite}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:.95}}
.scene-wrap.lit .bulb{filter:drop-shadow(0 0 12px var(--warm))}
.scene-wrap.lit .halo{opacity:1}
.scene-wrap.pulled .quilt{transform:translateY(-16px) scaleY(1.06);transform-origin:bottom}
.scene-wrap .quilt{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.scene-wrap .scroll{transition:transform .35s ease}
.scene-wrap .stars{transition:transform .5s ease}

/* 电梯门开了 */
.lift-door{transition:transform 1.1s cubic-bezier(.2,.8,.2,1);transform-origin:200px 114px}
.scene-wrap.arrive .lift-door{transform:scaleX(.16)}
.scene-wrap.arrive .floor-num{animation:floorblink 1.1s ease}
@keyframes floorblink{0%{opacity:.25}40%{opacity:.25}100%{opacity:1}}

/* 叙述 */
.narration{min-height:5.6em}
.narration.typing{cursor:pointer}
.narration .line{
  margin:0 0 10px;font-size:16.5px;line-height:1.9;color:var(--ink);
  opacity:0;transform:translateY(8px);
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1);
}
.narration .line.in{opacity:1;transform:none}
.type-skip{
  font:inherit;font-size:12.5px;color:var(--ink-faint);letter-spacing:.04em;
  padding:5px 12px;min-height:34px;margin:0 0 4px;
  border:1px dashed var(--line);border-radius:99px;background:transparent;cursor:pointer;
  transition:color .2s ease,border-color .2s ease;
}
.type-skip:hover{color:var(--warm);border-color:rgba(255,201,138,.45)}
.caret{display:inline-block;width:.45em;height:1.05em;vertical-align:-.16em;background:var(--warm);
  margin-left:.18em;animation:blink 1.05s steps(1) infinite;border-radius:2px}
.narration .line:last-child .caret{opacity:.55}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* 小动作 */
.action{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  width:100%;margin:6px 0 22px;padding:14px 18px;min-height:56px;
  font:inherit;font-size:16px;color:var(--ink);
  border:1px dashed rgba(255,255,255,.26);border-radius:var(--radius);
  background:rgba(255,255,255,.04);cursor:pointer;
  transition:background .25s ease,border-color .25s ease,transform .2s ease;
}
.action small{font-size:12px;color:var(--ink-faint);letter-spacing:.05em}
.action:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.4)}
.action.done{
  border-style:solid;border-color:rgba(143,214,192,.5);background:rgba(143,214,192,.10);
}
.action.done small{color:var(--accent)}

/* 长按：进度环 */
.action.holdable{position:relative;overflow:hidden}
.action.holdable::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:conic-gradient(from 180deg,rgba(255,196,140,.34) calc(var(--p,0) * 360deg),transparent 0);
  opacity:0;transition:opacity .22s ease;
}
.action.holding::before{opacity:1}
.action.holding{border-color:rgba(255,196,140,.55)}
.action.holding small{color:var(--warm)}
.holdable{cursor:pointer;touch-action:none}

/* 4-7-8 呼吸 */
.breath[hidden]{display:none}
.breath{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  margin:0 0 22px;padding:24px 18px 18px;border-radius:var(--radius);
  border:1px solid rgba(143,214,192,.22);background:rgba(143,214,192,.06);
}
.breath-circle{
  width:104px;height:104px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(255,228,196,.95),rgba(143,214,192,.55) 58%,rgba(143,214,192,.14));
  box-shadow:0 0 44px rgba(143,214,192,.32);
  transform:scale(.42);
}
.breath-word{font-family:var(--display);font-size:23px;letter-spacing:.34em;color:var(--ink);margin:0}
.breath-count{font-size:12px;letter-spacing:.16em;color:var(--ink-faint);margin:0}

/* 选项 */
.options-lead{font-size:12.5px;letter-spacing:.2em;color:var(--ink-faint);margin:0 0 12px}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  font:inherit;font-size:16px;color:var(--ink);
  padding:14px 16px;min-height:56px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:rgba(255,255,255,.04);cursor:pointer;
  transition:transform .18s ease,background .2s ease,border-color .2s ease,opacity .3s ease;
}
.opt:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.3);transform:translateX(3px)}
.opt:disabled{opacity:.4;cursor:default;transform:none}
.opt-key{
  flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.28);font-size:12px;color:var(--ink-soft);
}
.opt.picked{border-color:var(--warm);background:rgba(255,201,138,.12);opacity:1}
.opt.picked .opt-key{border-color:var(--warm);color:var(--warm)}

/* 回复 */
.reply{
  margin:18px 0 4px;padding:16px 18px;border-left:2px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.045);border-radius:0 var(--radius) var(--radius) 0;
}
.reply .line{margin:0 0 8px;font-size:16px;line-height:1.9;opacity:1;transform:none}
.reply .line:last-child{margin-bottom:0}
.reply.good{border-left-color:var(--accent)}
.reply.bad{border-left-color:var(--danger)}
.stage-foot{margin-top:18px}

/* ---------- 结算 ---------- */
.result-title{font-family:var(--display);font-size:clamp(26px,6vw,34px);margin:6px 0 4px}
.result-date{font-size:12.5px;color:var(--ink-faint);letter-spacing:.14em;margin:0 0 18px}
.card-holder{
  border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  box-shadow:0 30px 60px -30px rgba(0,0,0,.8);max-width:420px;margin-bottom:20px;
  cursor:zoom-in;
}
#card{width:100%;height:auto;display:block}
.card-cap{margin:10px 0 0;padding:0 2px}
/* 卡片放大看（灯箱） */
body.card-zoom{overflow:hidden}
body.card-zoom .card-holder{
  position:fixed;inset:0;z-index:80;margin:0;max-width:none;
  border:0;border-radius:0;background:rgba(10,8,20,.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  cursor:zoom-out;
}
body.card-zoom #card{
  width:auto;height:82vh;max-width:92vw;max-height:82vh;
  border-radius:14px;box-shadow:0 40px 90px -24px rgba(0,0,0,.9);
}
body.card-zoom .card-cap{display:none}
body.card-zoom .card-holder::after{
  content:'再点一下收起 · 也可以按 Esc';font-size:12.5px;color:var(--ink-faint);letter-spacing:.06em;
}
.summary-line{
  font-size:13.5px;letter-spacing:.02em;color:var(--ink-faint);
  margin:0 0 18px;line-height:2;
}
.summary-line b{color:var(--ink-soft);font-weight:600}
.ending{padding:18px 20px;border-radius:var(--radius);background:rgba(255,201,138,.08);
  border:1px solid rgba(255,201,138,.22);margin-bottom:22px}
.ending-title{font-family:var(--display);font-size:19px;color:var(--warm);margin:0 0 10px}
.ending-line{margin:0 0 8px;font-size:16px;line-height:1.9}
.ending-line.tomorrow{color:var(--ink-soft);border-top:1px dashed rgba(255,255,255,.18);padding-top:10px;margin-top:12px}
.result-actions{display:flex;flex-wrap:wrap;gap:12px}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 键盘焦点: 别让键盘用户看不见自己在哪 */
:focus-visible{outline:2px solid rgba(255,201,138,.9);outline-offset:3px;border-radius:6px}
.note-row input:focus-visible{outline:2px solid rgba(255,201,138,.9);outline-offset:2px}
#result-title:focus-visible{outline:none}

/* 小屏 */
@media (max-width:520px){
  .stage{padding:10px 16px 56px}
  .topbar{padding:14px 16px 6px}
  .meter{padding:4px 16px 0}
  .opt{font-size:15.5px}
}

/* 无障碍: 尊重减弱动效偏好 */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>
<body data-screen="lobby">
<div class="bg" aria-hidden="true"></div>

<header class="topbar">
  <span class="brand">下班后的十五分钟</span>
  <button id="btn-sound" class="sound" aria-pressed="false" aria-label="声音开关">🔊</button>
</header>

<div class="meter" id="meter" aria-hidden="true">
  <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
  <span class="meter-text" id="meter-text">电量 60%</span>
</div>

<main id="stage" class="stage"></main>

<p id="live" class="sr-only" aria-live="polite"></p>

<script>/* ===========================================================
 * content.js —— 《下班后的十五分钟》的全部文案与场景美术
 * 所有插画均为内联 SVG（无位图素材），色调随站点推进从黄昏走到深夜。
 * =========================================================== */
(function (global) {
  'use strict';

  /* ---------------- 场景插画 ---------------- */

  const SCENES = {
    office: `
<svg viewBox="0 0 400 240" class="scene" aria-hidden="true">
  <defs>
    <linearGradient id="g-office" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--s-a)"/><stop offset="1" stop-color="var(--s-b)"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="42%">
      <stop offset="0" stop-color="var(--glow)" stop-opacity=".55"/>
      <stop offset="1" stop-color="var(--glow)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#g-office)"/>
  <rect width="400" height="240" fill="url(#glow)"/>
  <g class="win">
    <rect x="28" y="34" width="70" height="86" rx="6" fill="var(--s-c)" opacity=".55"/>
    <line x1="28" y1="66" x2="98" y2="66" stroke="var(--s-d)" stroke-width="2" opacity=".5"/>
    <line x1="28" y1="86" x2="98" y2="86" stroke="var(--s-d)" stroke-width="2" opacity=".35"/>
  </g>
  <rect x="0" y="150" width="400" height="6" rx="3" fill="var(--s-c)" opacity=".8"/>
  <g class="monitor">
    <rect x="130" y="56" width="150" height="86" rx="9" fill="var(--panel)"/>
    <rect x="136" y="62" width="138" height="74" rx="5" fill="var(--screen)"/>
    <g class="screen-lines" opacity=".5">
      <rect x="146" y="74" width="86" height="6" rx="3" fill="var(--screen-line)"/>
      <rect x="146" y="88" width="118" height="6" rx="3" fill="var(--screen-line)"/>
      <rect x="146" y="102" width="64" height="6" rx="3" fill="var(--screen-line)"/>
      <rect x="146" y="116" width="98" height="6" rx="3" fill="var(--screen-line)"/>

<script>/* ===========================================================
 * audio.js —— 纯 Web Audio 合成器，零音频素材、零外部依赖
 * 场景: 雨夜 / 暖光 / 地铁 / 森林 等环境床 + 八音盒铃音 + 钢琴质感垫底
 * 所有声音都由代码实时生成, 因此单文件离线可用, 体积为 0。
 * =========================================================== */
(function (global) {
  'use strict';

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* ---------- 音阶 ---------- */
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  // 五声音阶(宫调式): 听起来"治愈"、不刺耳
  const PENTA = [0, 2, 4, 7, 9];
  function pentFreq(step, root) {
    // step: 全局半音序号, root: 基准半音
    const semis = root + step;
    return 440 * Math.pow(2, (semis - 9) / 12);
  }

  class AudioEngine {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.sceneGain = null;
      this.nodes = [];
      this.muted = false;
      this.volume = 0.7;
      this.scene = 'none';
      this._timer = null;
      this._beat = 0;
      this._nextNoteTime = 0;
      this._started = false;
    }

    /* 必须由用户手势触发(浏览器自动播放策略) */

        this.master = this.ctx.createGain();
        this.master.gain.value = this.volume;
        this.master.connect(this.ctx.destination);
        this.sceneGain = this.ctx.createGain();

        this.master.gain.setTargetAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime, 0.08);
      }
      return this.muted;
    }

    /* ---------- 基础音色 ---------- */

    // 八音盒 / 音乐盒: 非谐波加法合成 + 快速衰减

      out.gain.exponentialRampToValueAtTime(0.0001, when + dur);

        [2.01, 0.45, 0.62],
        [3.02, 0.22, 0.42],
        [5.4, 0.08, 0.26],

        it.o.onended = () => {

      noise.start(when);
      noise.stop(when + 0.06);
      noise.onended = () => { try { ng.disconnect(); noise.disconnect(); } catch (e) {} };

      lp.type = 'lowpass';

      lp.frequency.linearRampToValueAtTime(400, when + dur);

      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(gain, when + 0.5);

      o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.master);

      o.stop(when + dur + 0.05); o2.stop(when + dur + 0.05);

      this.bell(freq, this.ctx.currentTime + 0.01, 0.28, gain);

      const ctx = this.ctx;
      const len = Math.floor(ctx.sampleRate * seconds);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {

        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522;

      }
      return buf;
    }

    _startBed(kind) {
      const ctx = this.ctx;
      this.stopBed();
      const src = ctx.createBufferSource();
      src.loop = true;

        const lp = ctx.createBiquadFilter();

      } else if (kind === 'wind') {
        src.buffer = this._pinkBuffer(5);
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.7;
        const g = ctx.createGain(); g.gain.value = 0.55;
        src.connect(lp); lp.connect(g); g.connect(this.sceneGain);
        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.045;
        const lfoG = ctx.createGain(); lfoG.gain.value = 620;
        lfo.connect(lfoG); lfoG.connect(lp.frequency);
        lfo.start();
        this.nodes.push(lfo, lfoG);

        src.buffer = this._pinkBuffer(4);
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.8;
        const g = ctx.createGain(); g.gain.value = 0.22;
        src.connect(bp); bp.connect(g); g.connect(this.sceneGain);
      } else {
        return;
      }

      this.nodes.push(src);
      this.sceneGain.gain.cancelScheduledValues(ctx.currentTime);
      this.sceneGain.gain.setTargetAtTime(1, ctx.currentTime, 0.8);
    }

    _drip() {
      if (!this.ctx || this.muted) return;
      const ctx = this.ctx;
      const t = ctx.currentTime + 0.02;
      const o = ctx.createOscillator();
      o.type = 'sine';
      const f = 700 + Math.random() * 1400;
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.45, t + 0.08);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.05 + Math.random() * 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(this.sceneGain);
      o.start(t); o.stop(t + 0.2);
      o.onended = () => { try { g.disconnect(); o.disconnect(); } catch (e) {} };
    }

    stopBed() {
      if (this._dripTimer) { clearInterval(this._dripTimer); this._dripTimer = null; }
      this.nodes.forEach((n) => { try { n.stop && n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} });
      this.nodes = [];
      if (this.sceneGain && this.ctx) {
        this.sceneGain.gain.cancelScheduledValues(this.ctx.currentTime);
        this.sceneGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.4);
      }
    }

    /* ---------- 场景 ---------- */
    // scene: 'rain' | 'wind' | 'room' | 'none'

      if (!this.ensure()) return;
      if (scene === this.scene) return;
      this.scene = scene;
      if (scene === 'none') { this.stopBed(); return; }
      this._startBed(scene);

    // 8 小节循环, 温柔的 C 大调五声音阶
    startMelody(root = -9, tempo = 76) {
      if (!this.ensure()) return;
      this.stopMelody();
      this._beat = 0;
      this._nextNoteTime = this.ctx.currentTime + 0.15;
      const spb = 60 / tempo;
      const pattern = [
        // [step, 时值(拍)]
        [0, 1], [2, 1], [4, 1], [3, 1],
        [2, 1], [1, 1], [0, 1], [-3, 2],
        [1, 1], [0, 1], [-1, 1], [0, 1],
        [2, 1], [4, 1], [3, 1], [1, 1],
        [0, 1], [-1, 1], [-3, 1], [-5, 2],
      ];
      this._melody = { root, spb, pattern, idx: 0 };
      this._timer = setInterval(() => this._schedule(), 40);
      this._schedule();
    }

    // 每小节底垫: 固定音高, 不得随会话时间漂移
    _padFreq(root) {
      return pentFreq(0, root - 12);
    }

    _schedule() {
      if (!this._melody || !this.ctx) return;
      const { root, spb, pattern } = this._melody;
      const lookahead = 0.25;
      while (this._nextNoteTime < this.ctx.currentTime + lookahead) {
        const [step, beats] = pattern[this._melody.idx % pattern.length];
        const oct = Math.floor(step / 5);
        const inOct = ((step % 5) + 5) % 5;
        const semis = oct * 12 + PENTA[inOct];
        const f = pentFreq(semis, root);
        this.bell(f, this._nextNoteTime, 2.2, 0.22);
        // 每小节底垫
        if (this._melody.idx % 4 === 0) {
          this.pad(this._padFreq(root), this._nextNoteTime, spb * 4.4, 0.08);
        }
        this._nextNoteTime += beats * spb;
        this._melody.idx++;

    stopMelody() {
      if (this._timer) { clearInterval(this._timer); this._timer = null; }
      this._melody = null;
    }

    /* ---------- 自检(离线渲染, 供自动化测试) ---------- */
    async selftest() {
      const out = { ok: false };
      try {
        const OC = global.OfflineAudioContext || global.webkitOfflineAudioContext;
        const oc = new OC(2, 44100 * 2, 44100);
        // 复用本引擎的 bell 逻辑需要 this.ctx, 这里做一个轻量替身
        const fake = Object.create(AudioEngine.prototype);
        fake.ctx = oc;
        fake.master = oc.createGain();
        fake.master.gain.value = 1;
        fake.master.connect(oc.destination);
        fake._noiseBuffer = AudioEngine.prototype._noiseBuffer;
        fake.bell(880, 0.05, 1.2, 0.5);
        fake.pad(fake._padFreq(-9), 0.05, 2.0, 0.08);
        const rendered = await oc.startRendering();
        const d = rendered.getChannelData(0);
        let peak = 0, sum = 0;
        for (let i = 0; i < d.length; i++) {
          const a = Math.abs(d[i]);
          if (a > peak) peak = a;
          sum += d[i] * d[i];
        }
        const rms = Math.sqrt(sum / d.length);
        out.ok = isFinite(peak) && isFinite(rms) && peak > 0.01 && peak <= 1.0 && rms > 0.001;
        out.peak = +peak.toFixed(4);
        out.rms = +rms.toFixed(4);
        out.clipped = peak >= 0.999;
        // 底垫音高必须恒定(旧版会随 ctx.currentTime 一路爬升)
        out.padFreq = +this._padFreq(-9).toFixed(2);
        out.padStable = Math.abs(out.padFreq - 77.78) < 0.5;
      } catch (e) {
        out.error = String(e && e.message || e);
      }
      return out;
    }
  }

  const engine = new AudioEngine();
  global.AudioEngine = AudioEngine;
  global.audio = engine;

  const CLOSE_PUNCT = '」』）〕】》〉"，。、！？：；·…—';
  const wrapLog = [];          // 最近一次排版的每一行(给自检用)
  function wrapText(ctx, text, x, y, maxW, lineH, maxLines) {
    const chars = Array.from(text);
    let line = '', ly = y, lines = 0;
    const emit = (t) => { wrapLog.push(t); ctx.fillText(t, x, ly); ly += lineH; };
    for (let i = 0; i < chars.length; i++) {
      const test = line + chars[i];
      if (ctx.measureText(test).width > maxW && line) {
        if (CLOSE_PUNCT.indexOf(chars[i]) >= 0) {
          // 行首禁则: 收尾标点不另起一行, 悬挂在本行末尾（轻微出血，仍在画布内）
          emit(test);
          line = '';
        } else {
          emit(line);
          line = chars[i];
        }
        lines++;
      } else {
        line = test;
      }
      if (maxLines && lines >= maxLines) return ly;
    }
    if (line && (!maxLines || lines < maxLines)) emit(line);
    return ly;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function setScreen(name) {
    document.body.dataset.screen = name;
  }

  /* ---------------- 音效 ---------------- */
  const A = window.audio;
  function ensureAudio() {
    if (!A) return;
    A.ensure();
    if (!state.started) {
      state.started = true;
      A.setScene(C.STAGES[0].bed || 'room');
      A.startMelody(-9, 72);
    }
  }
  function setBed(bed) {
    if (A && state.started) A.setScene(bed || 'room');
  }

  /* ---------------- 打字机 ---------------- */
  let typingTimers = [];
  let typingPending = [];   // 还没显示的行: {i, ln, p}
  let typingOpts = null;
  let typingSkipBtn = null;
  let typingContainer = null;

  function setTypingClass(on) {
    if (typingContainer) typingContainer.classList.toggle('typing', !!on);
  }
  function clearTyping() {
    typingTimers.forEach((t) => clearTimeout(t));
    typingTimers = [];
    typingPending = [];
    typingOpts = null;
    setTypingClass(false);
    hideTypeSkip();
  }
  function hideTypeSkip() {
    if (typingSkipBtn && typingSkipBtn.parentNode) typingSkipBtn.parentNode.removeChild(typingSkipBtn);
    typingSkipBtn = null;
  }
  function revealLine(p, ln, i) {
    p.classList.add('in');
    p.innerHTML = esc(ln) + '<span class="caret"></span>';
    if (typingOpts && typingOpts.onLine) typingOpts.onLine(i, ln);
  }
  function typeLines(container, lines, opts) {
    clearTyping();
    opts = opts || {};
    typingOpts = opts;
    const delay = opts.delay == null ? 620 : opts.delay;
    const step = opts.step == null ? 700 : opts.step;
    container.innerHTML = '';
    typingContainer = container;
    setTypingClass(true);
    lines.forEach((ln, i) => {
      const p = document.createElement('p');
      p.className = 'line';
      p.setAttribute('data-full', ln);
      p.innerHTML = '<span class="caret"></span>';
      container.appendChild(p);
      const item = { i: i, ln: ln, p: p };
      typingPending.push(item);
      const t = setTimeout(() => {
        typingPending = typingPending.filter((x) => x !== item);
        revealLine(p, ln, i);
        if (!typingPending.length) { hideTypeSkip(); setTypingClass(false); }
      }, delay + i * step);
      typingTimers.push(t);
    });
    // 跳过按钮: 只在还有没显示的行时出现, 打完就消失
    if (typingPending.length && container.parentNode) {
      const b = document.createElement('button');
      b.className = 'type-skip';
      b.type = 'button';
      b.textContent = '跳过打字';
      b.setAttribute('aria-label', '跳过打字，直接显示全部叙述');
      b.addEventListener('click', (e) => { e.stopPropagation(); skipTyping(); });
      container.parentNode.insertBefore(b, container.nextSibling);
      typingSkipBtn = b;
    }
    return typingTimers.length;
  }
  function skipTyping() {
    // 立即显示所有还没出现的行, 并补齐 onLine 回调,
    // 否则选项不会出现, 流程会卡住
    const pend = typingPending.slice();
    typingPending = [];
    typingTimers.forEach((t) => clearTimeout(t));
    typingTimers = [];
    pend.forEach((it) => revealLine(it.p, it.ln, it.i));
    setTypingClass(false);
    hideTypeSkip();
  }

  /* ---------------- 渲染：大厅 ---------------- */
  function renderLobby() {
    state.screen = 'lobby';
    setScreen('lobby');
    setBed('room');
    const done = loadState();
    const note = loadNote();
    const daily = state.sign || (state.sign = C.DAILY_SIGNS[hashDay(dateKey()) % C.DAILY_SIGNS.length]);
    const tip = C.TIPS[hashDay(dateKey() + 'tip') % C.TIPS.length];

    el.stage.innerHTML = `
      <section class="screen lobby fade-in">
        <div class="lobby-sky" aria-hidden="true"></div>
        <div class="lobby-grid">
        <div class="lobby-main">
          <p class="clock">${nowTime()}</p>
          <h1 class="title">下班后的<br><span>十五分钟</span></h1>
          <p class="lede">一个不需要你做任何决定的疗愈小程序。<br>
          接下来的十几分钟，只有你，和一点点声音。</p>
          <div class="lobby-actions">
            <button class="cta" id="btn-start">打卡下班</button>
            ${done ? '<button class="ghost" id="btn-view">今天已经下班过了 · 看结算</button>' : ''}
          </div>
          <p class="micro">全程约 3 分钟 · 会放一点点声音 · 随时可以关掉</p>
          <div class="sign-card">
            <span class="sign-label">今日一签</span>
            <p class="sign-text">${esc(daily)}</p>
            <span class="sign-tip">${esc(tip)}</span>
          </div>
          ${note && !note.taken ? `
          <div class="note-card" id="note-card">
            <span class="sign-label">给明天留的话</span>
            <p class="sign-text">${esc(note.text)}</p>
            <button class="ghost small" id="btn-take">收下了</button>
          </div>` : ''}
          <p class="music-line"><span class="music-title">配套纯音乐《十五分钟》</span><audio controls preload="metadata" src="after15.mp3" aria-label="配套纯音乐《十五分钟》"></audio><a class="ghost small" href="after15.mp3" download>下载 mp3</a><span class="micro"> · 4.1 MB · 今晚可以单曲循环</span></p>
        </div>
        <div class="lobby-art-wrap" role="img" aria-label="${esc(C.SCENE_ALT.dusk)}">${C.SCENES.dusk}</div>
        </div>
      </section>`;

    $('#btn-start').addEventListener('click', () => {
      ensureAudio();
      state.battery = 60; state.waste = 0; state.acts = 0; state.picks = [];
      state.idx = -1;
      nextStage();
    });
    const view = $('#btn-view');
    if (view) view.addEventListener('click', () => {
      ensureAudio();
      const s = loadState();
      if (s) {
        state.battery = s.battery; state.waste = s.waste; state.acts = s.acts; state.picks = s.picks || [];
        state.cardReady = true;
        renderResult(true);
      }
    });
    const take = $('#btn-take');
    if (take) take.addEventListener('click', () => {
      takeNote();
      const card = $('#note-card');
      if (card) card.classList.add('fold');
    });
  }

  /* ---------------- 渲染：旅程中的一站 ---------------- */
  function nextStage() {
    state.idx++;
    clearBreath();
    if (state.idx >= C.STAGES.length) { renderResult(); return; }
    const st = C.STAGES[state.idx];
    state.screen = st.id;
    setScreen('stage');
    state.stageStart = Date.now();
    state.rewarded = false;
    setBed(st.bed);

    el.stage.innerHTML = `
      <section class="screen stage-view fade-in" data-stage="${st.id}" tabindex="-1" style="
          --s-a:${st.palette.a}; --s-b:${st.palette.b}; --s-c:${st.palette.c};
          --s-d:${st.palette.d}; --glow:${st.palette.glow};">
        <div class="stage-head">
          <span class="stage-time">${st.time}</span>
          <span class="stage-name">${esc(st.name)}</span>
          <span class="stage-count">${state.idx + 1} / ${C.STAGES.length}</span>
        </div>
        <div class="scene-wrap" id="scene-wrap" role="img" aria-label="${esc(C.SCENE_ALT[st.scene] || st.name)}">${C.SCENES[st.scene]}</div>
        <div class="narration" id="lines" aria-live="polite"></div>
        <button class="action" id="btn-action" data-kind="${st.action.kind}">${esc(st.action.label)}<small>${esc(st.action.hint)}</small></button>
        ${st.id === 'bed' ? `
        <div class="breath" id="breath" hidden>
          <div class="breath-circle" id="breath-circle"></div>
          <p class="breath-word" id="breath-word">准备好了</p>
          <p class="breath-count" id="breath-count">跟着圆圈就好，不用做对</p>
          <button class="ghost small" id="btn-breath-skip">不呼吸了</button>
        </div>` : ''}
        <div class="options" id="options" aria-live="polite"></div>
        <div class="stage-foot">
          <button class="ghost small" id="btn-skip">跳过这一站</button>
        </div>
      </section>`;

    typeLines($('#lines'), st.narration, {
      onLine: (i, ln) => { if (i === st.narration.length - 1) renderOptions(st); },
    });
    // 点叙述文字也可以直接跳过打字
    const narration = $('#lines');
    if (narration) {
      narration.addEventListener('click', () => { if (typingPending.length) skipTyping(); });
    }

    if (st.action.kind === 'hold') setupHold(st);
    else $('#btn-action').addEventListener('click', (e) => doAction(st, e.currentTarget));
    const bskip = $('#btn-breath-skip');
    if (bskip) bskip.addEventListener('click', stopBreathing);
    $('#btn-skip').addEventListener('click', () => { clearTyping(); advance(st); });
    setupSceneAction(st);
    updateMeter();
    const sec = $('.screen.stage-view');
    if (sec) sec.focus({ preventScroll: true });
    // 换站回到顶部, 否则新的一站是从半截屏幕开始的
    scrollTop();
  }
  function scrollTop() {
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch (e) { window.scrollTo(0, 0); }
  }
  function scrollIntoViewIfNeeded(node, block) {
    if (!node || !node.scrollIntoView) return;
    try { node.scrollIntoView({ block: block || 'nearest', behavior: 'smooth' }); } catch (e) { /* ignore */ }
  }

  function renderOptions(st) {
    const box = $('#options');
    if (!box || box.dataset.ready) return;
    box.dataset.ready = '1';
    box.innerHTML = '<p class="options-lead">此刻你会——</p>';
    st.options.forEach((op, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = `<span class="opt-key">${'123'[i]}</span><span class="opt-label">${esc(op.label)}</span>`;
      b.addEventListener('click', () => choose(st, op, b));
      box.appendChild(b);
    });
  }

  function choose(st, op, btn) {
    ensureAudio();
    $$('#options .opt').forEach((b) => { b.disabled = true; b.classList.remove('picked'); });
    btn.classList.add('picked');
    if (A) A.tick(660 + Math.random() * 120, 0.16);

    state.battery = Math.max(0, Math.min(100, state.battery + op.delta));
    state.waste += op.reply.join('').replace(/\s/g, '').length;
    state.picks.push({ stage: st.id, tag: op.tag, delta: op.delta });

    const box = $('#options');
    const reply = document.createElement('div');
    reply.className = 'reply fade-in';
    reply.innerHTML = op.reply.map((l) => `<p class="line in">${esc(l)}</p>`).join('');
    box.appendChild(reply);
    if (op.delta >= 4) reply.classList.add('good');
    if (op.delta <= 0) reply.classList.add('bad');
    if (op.note) renderNote(st, op, reply);
    updateMeter();

    const next = document.createElement('button');
    next.className = 'cta next fade-in';
    next.textContent = state.idx === C.STAGES.length - 1 ? '今天结束了，去结算' : '继续往前走 →';
    next.addEventListener('click', () => advance(st));
    box.appendChild(next);
    next.focus({ preventScroll: true });
    // 小屏上回应和按钮常常在折叠线以下, 把它带到眼前
    scrollIntoViewIfNeeded(next, 'nearest');
  }

  function advance(st) {
    clearTyping();
    clearBreath();
    if (A) A.tick(880, 0.12);
    nextStage();
  }

  /* ---------------- 每站的小动作 ---------------- */
  function setupSceneAction(st) {
    const wrap = $('#scene-wrap');
    const kind = st.action.kind;
    if (!wrap) return;
    if (kind === 'screen') {
      wrap.classList.add('clickable');
      wrap.addEventListener('click', () => doAction(st));
    } else if (kind === 'drag') {
      const scroll = $('.scroll', wrap);
      const stars = $('.stars', wrap);
      let dragging = false, x0 = 0, off = 0;
      const move = (dx) => {
        off = Math.max(-120, Math.min(120, dx));
        if (scroll) scroll.setAttribute('transform', `translate(${off * 0.6},0)`);
        if (stars) stars.setAttribute('transform', `translate(${off * 0.25},0)`);
      };
      wrap.addEventListener('pointerdown', (e) => {
        dragging = true; x0 = e.clientX; wrap.setPointerCapture(e.pointerId);
      });
      wrap.addEventListener('pointermove', (e) => { if (dragging) move(e.clientX - x0); });
      wrap.addEventListener('pointerup', () => {
        if (dragging && Math.abs(off) > 40) {
          if (A) A.tick(520, 0.14);
          rewardAction(st.action.success);
        }
        dragging = false;
      });
      wrap.addEventListener('pointercancel', () => { dragging = false; });
    } else if (kind === 'cup') {
      const cup = $('.cup', wrap);
      wrap.classList.add('clickable');
      wrap.addEventListener('click', (e) => {
        if (cup && !e.target.closest('.opt')) doAction(st);
      });
    } else if (kind === 'stomp') {
      wrap.classList.add('clickable');
      wrap.addEventListener('click', () => doAction(st));
      // 不给插画加 tabindex: 它对读屏用户是一张图, 可操作的入口是下面的按钮
    } else if (kind === 'quilt') {
      wrap.classList.add('clickable');
      wrap.addEventListener('click', () => doAction(st));
    }
  }

  /* 按钮兜底：任何一站，点"做点什么"都能完成这一站的小动作 */
  function doAction(st) {
    const kind = st.action.kind;
    const wrap = $('#scene-wrap');
    if (wrap) {
      if (kind === 'screen') wrap.classList.add('is-off');
      else if (kind === 'cup') {
        wrap.classList.add('warm');
        const cup = $('.cup', wrap);
        if (cup) cup.classList.add('steaming');
      } else if (kind === 'stomp') wrap.classList.add('lit');
      else if (kind === 'quilt') wrap.classList.add('pulled');
    }
    const tone = kind === 'screen' ? 320 : kind === 'cup' ? 440 : kind === 'stomp' ? 360 : 300;
    if (A) A.tick(tone, 0.18);
    rewardAction(st.action.success);
  }

  /* 长按：电梯按钮，按住到门来 */
  const HOLD_MS = 1100;
  function setupHold(st) {
    const wrap = $('#scene-wrap');
    if (wrap) wrap.classList.add('clickable');
    const btn = $('#btn-action');
    const svgBtn = wrap ? $('.btn', wrap) : null;
    const targets = [btn, svgBtn].filter(Boolean);
    if (btn) btn.style.setProperty('--p', '0');
    let timer = null, raf = null, start = 0;

    const end = (silent) => {
      const wasHolding = !!timer;
      if (timer) { clearTimeout(timer); timer = null; }
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      targets.forEach((x) => x.classList.remove('holding'));
      if (btn && !state.rewarded) btn.style.setProperty('--p', '0');
      if (wasHolding && !silent && !state.rewarded && el.live) {
        el.live.textContent = '电梯还在楼上。再多按一会儿。';
      }
    };
    const begin = (e, t) => {
      if (state.rewarded || timer) return;
      if (e && e.cancelable) e.preventDefault();
      try { if (e && e.pointerId != null && t && t.setPointerCapture) t.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      start = performance.now();
      targets.forEach((x) => x.classList.add('holding'));
      const step = () => {
        const p = Math.min(1, (performance.now() - start) / HOLD_MS);
        if (btn) btn.style.setProperty('--p', String(p));
        if (p < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
      timer = setTimeout(() => {
        end(true);                       // 成功时不要播报"再多按一会儿"
        if (state.rewarded) return;
        const w = $('#scene-wrap');
        if (w) w.classList.add('arrive');
        if (A) A.tick(520, 0.16);
        rewardAction(st.action.success);
      }, HOLD_MS);
    };

    targets.forEach((t) => {
      t.classList.add('holdable');
      t.addEventListener('pointerdown', (e) => begin(e, t));
      t.addEventListener('pointerup', () => end(false));
      t.addEventListener('pointercancel', () => end(false));
    });

    // 键盘也能"按住"：空格 / 回车
    if (btn) {
      btn.addEventListener('keydown', (e) => {
        if (e.key !== ' ' && e.key !== 'Enter') return;
        if (e.repeat) return;
        e.preventDefault();
        e.stopPropagation();              // 别让全局回车键把这一站跳过去
        begin(e, btn);
      });
      btn.addEventListener('keyup', (e) => {
        if (e.key !== ' ' && e.key !== 'Enter') return;
        end(false);
      });
      btn.addEventListener('blur', () => { if (timer) end(false); });
    }
  }

  function rewardAction(text) {
    if (state.rewarded) return;
    state.rewarded = true;
    state.acts++;
    state.battery = Math.min(100, state.battery + 1);
    state.waste += text.replace(/\s/g, '').length;
    updateMeter();
    const btn = $('#btn-action');
    if (btn && !btn.dataset.done) {
      btn.dataset.done = '1';
      btn.classList.add('done');
      btn.innerHTML = `已完成 <small>${esc(text)}</small>`;
    }
    const live = el.live;
    if (live) live.textContent = text;
    // 小动作做完后, 顺手把下面的选项带进视野
    const opts = $('#options');
    if (opts && opts.children.length) scrollIntoViewIfNeeded(opts, 'nearest');
    // 最后一站: 被子盖好之后, 顺手送你两轮呼吸
    const st = C.STAGES[state.idx];
    if (st && st.id === 'bed' && $('#breath')) {
      breathTimers.push(setTimeout(startBreathing, 1400));
    }
  }

  /* ---------------- 4-7-8 呼吸 ---------------- */
  const BREATH_CYCLES = 2;
  const BREATH_PHASES = [
    { word: '吸气', ms: 4000, scale: 1, ease: 'cubic-bezier(.2,.7,.3,1)', tone: 392 },
    { word: '停住', ms: 7000, scale: 1, ease: 'linear', tone: 330 },
    { word: '呼气', ms: 8000, scale: 0.42, ease: 'cubic-bezier(.45,0,.4,1)', tone: 294 },
  ];
  let breathTimers = [];
  function clearBreath() {
    breathTimers.forEach((t) => clearTimeout(t));
    breathTimers = [];
  }
  function startBreathing() {
    const box = $('#breath');
    const circle = $('#breath-circle');
    const word = $('#breath-word');
    const count = $('#breath-count');
    if (!box || !circle || !word || !count) return;
    box.hidden = false;
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let cycle = 0;
    const tone = (f) => {
      if (A && A.ctx) A.bell(f, A.ctx.currentTime + 0.02, 1.9, 0.16);
    };
    const run = (idx) => {
      if (cycle >= BREATH_CYCLES) {
        word.textContent = '今天到这里';
        count.textContent = '你已经把自己放下来了';
        circle.style.transition = 'transform 1.8s ease, opacity 1.8s ease';
        circle.style.transform = 'scale(.42)';
        circle.style.opacity = '.22';
        tone(262);
        state.battery = Math.min(100, state.battery + 4);
        updateMeter();
        return;
      }
      const p = BREATH_PHASES[idx];
      word.textContent = p.word;
      count.textContent = '第 ' + (cycle + 1) + ' / ' + BREATH_CYCLES + ' 轮';
      if (reduced) {
        circle.style.transition = 'none';
        circle.style.opacity = '.5';
      } else {
        circle.style.transition = 'transform ' + p.ms + 'ms ' + p.ease;
        circle.style.transform = 'scale(' + p.scale + ')';
      }
      tone(p.tone);
      breathTimers.push(setTimeout(() => {
        if (idx + 1 >= BREATH_PHASES.length) { cycle++; run(0); }
        else run(idx + 1);
      }, p.ms));
    };
    run(0);
  }
  function stopBreathing() {
    clearBreath();
    const box = $('#breath');
    const word = $('#breath-word');
    const count = $('#breath-count');
    if (box) box.hidden = true;
    if (word) word.textContent = '';
    if (count) count.textContent = '';
  }

  /* ---------------- 电量条 ---------------- */
  function updateMeter() {
    const b = Math.round(state.battery);
    if (el.meter) el.meter.style.width = b + '%';
    if (el.meter) el.meter.classList.toggle('low', b < 40);
    if (el.meterText) el.meterText.textContent = '电量 ' + b + '%';
  }

  /* ---------------- 给明天留一句话 ---------------- */
  const NOTE_KEY = 'after15.note.v1';
  function loadNote() {
    try {
      const raw = localStorage.getItem(NOTE_KEY);
      if (!raw) return null;
      const n = JSON.parse(raw);
      return n && n.text ? n : null;
    } catch (e) { return null; }
  }
  function saveNote(text) {
    try {
      localStorage.setItem(NOTE_KEY, JSON.stringify({ date: dateKey(), text: text, taken: false }));
    } catch (e) { /* 隐私模式：忽略 */ }
  }
  function takeNote() {
    const n = loadNote();
    if (!n) return;
    n.taken = true;
    try { localStorage.setItem(NOTE_KEY, JSON.stringify(n)); } catch (e) { /* ignore */ }
  }
  function renderNote(st, op, reply) {
    const box = document.createElement('div');
    box.className = 'note fade-in';
    box.innerHTML =
      '<label class="note-label" for="note-input">想留给明天的一句话（只存在这台设备上）</label>' +
      '<div class="note-row"><input id="note-input" type="text" maxlength="40" placeholder="比如：明天记得吃早饭">' +
      '<button class="ghost small" id="note-save">写好了</button></div>' +
      '<p class="micro note-hint">写完记得点一下「写好了」，它会替你想起来。</p>';
    reply.appendChild(box);
    const input = box.querySelector('#note-input');
    const save = box.querySelector('#note-save');
    setTimeout(() => { try { input.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 60);
    save.addEventListener('click', () => {
      const v = (input.value || '').trim();
      if (!v) { input.placeholder = '写一句再点呀，哪怕只有两个字'; input.focus(); return; }
      saveNote(v);
      save.textContent = '已留在本机 ✓';
      save.disabled = true;
      input.disabled = true;
      box.querySelector('.note-hint').textContent = '明天打开它，它会先把这句给你看。';
      // 把回应里的占位句换成你真正写下的那句
      const first = reply.querySelector('.line');
      if (first) first.textContent = '你给明天留了一句话：' + v;
      if (el.live) el.live.textContent = '已经替你留好了：' + v;
      if (A) A.bell(660, A.ctx ? A.ctx.currentTime + 0.02 : 0, 1.6, 0.14);
    });
  }

  /* ---------------- 结算 ---------------- */
  function mainline() {
    let best = null;
    state.picks.forEach((p) => { if (!best || p.delta > best.delta) best = p; });
    return best ? best.tag : '按时下班';
  }
  function endingFor(battery) {
    if (battery < 40) return C.ENDINGS.low;
    if (battery < 78) return C.ENDINGS.mid;
    return C.ENDINGS.high;
  }

  function renderResult(isView) {
    state.screen = 'result';
    setScreen('result');
    state.cardReady = true;
    setBed('rain');
    const end = endingFor(state.battery);
    const sign = state.sign || (state.sign = C.DAILY_SIGNS[hashDay(dateKey()) % C.DAILY_SIGNS.length]);

    el.stage.innerHTML = `
      <section class="screen result fade-in">
        <h2 class="result-title" id="result-title" tabindex="-1">今日情绪结算</h2>
        <p class="result-date">${dateKey()} · 下班后的十五分钟</p>
        <div class="card-holder" id="card-holder" title="点一下可以放大看">
          <canvas id="card" width="720" height="1080" role="img"
            aria-label="今日情绪结算卡片：主线 ${esc(mainline())}，废话 ${state.waste} 字，仪式 ${state.acts} 次，电量 ${Math.round(state.battery)}%"></canvas>
          <p class="micro card-cap">点一下卡片可以放大看 · 可以保存下来 · 下面是它写给你看的话</p>
        </div>
        <p class="summary-line" title="主线：今天你做过最像自己的一个选择 · 废话：今天说出口又咽回去的字 · 仪式：你认真完成的小动作 · 电量：还剩多少可以拿去明天">
          <span title="今天你做过最像自己的一个选择">主线 <b>${esc(mainline())}</b></span> ·
          <span title="今天说出口又咽回去的字">废话 ${state.waste} 字</span> ·
          <span title="你认真完成的小动作">仪式 ${state.acts} 次</span> ·
          <span title="还剩多少可以拿去明天">电量 ${Math.round(state.battery)}%</span>
        </p>
        <div class="ending">
          <p class="ending-title">${esc(end.title)}</p>
          ${end.lines.map((l) => `<p class="ending-line">${esc(l)}</p>`).join('')}
          ${C.TOMORROW.map((l) => `<p class="ending-line tomorrow">${esc(l)}</p>`).join('')}
        </div>
        <div class="result-actions">
          <button class="cta" id="btn-save">保存今日卡片</button>
          <button class="ghost" id="btn-copy">复制今日文案</button>
          <button class="ghost" id="btn-again">再下班一次</button>
        </div>
        <p class="music-line"><span class="music-title">配套纯音乐《十五分钟》</span><audio controls preload="metadata" src="after15.mp3" aria-label="配套纯音乐《十五分钟》"></audio><a class="ghost small" href="after15.mp3" download>下载 mp3</a><span class="micro"> · 4.1 MB · 今晚可以单曲循环</span></p>
        <p class="micro">今天没有解决任何问题，但你把自己带回来了。这也算数。</p>
      </section>`;

    drawCard();
    saveState();
    // 结算页从头开始看, 别停在上一页的滚动位置
    scrollTop();

    // 卡片放大看: 再点一下（或按 Esc）收起来
    const holder = $('#card-holder');
    if (holder) {
      holder.addEventListener('click', () => {
        const on = document.body.classList.toggle('card-zoom');
        if (A) A.tick(on ? 660 : 520, 0.12);
      });
    }
    // 结算页把焦点交给标题, 读屏用户能知道换页了
    const title = $('#result-title');
    if (title) { try { title.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }

    $('#btn-save').addEventListener('click', () => {
      const c = $('#card');
      const a = document.createElement('a');
      a.download = '下班后的十五分钟-' + dateKey() + '.png';
      a.href = c.toDataURL('image/png');
      a.click();
      if (A) A.tick(990, 0.16);
    });
    $('#btn-copy').addEventListener('click', async (e) => {
      const txt = [
        '【今日情绪结算】' + dateKey(),
        '主线：' + mainline(),
        '废话：' + state.waste + ' 字 · 仪式：' + state.acts + ' 次 · 电量：' + Math.round(state.battery) + '%',
        '今日一签：' + sign,
        '——' + endingFor(state.battery).lines.join(''),
      ].join('\n');
      try {
        await navigator.clipboard.writeText(txt);
        e.currentTarget.textContent = '已复制 ✓';
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); e.currentTarget.textContent = '已复制 ✓'; }
        catch (e2) { e.currentTarget.textContent = '复制失败，长按卡片吧'; }
        ta.remove();
      }
    });
    $('#btn-again').addEventListener('click', () => {
      state.battery = 60; state.waste = 0; state.acts = 0; state.picks = [];
      state.idx = -1;
      nextStage();
    });
  }

  /* ---------------- 卡片绘制 ---------------- */
  function drawCard() {
    const c = $('#card');
    if (!c) return;
    const ctx = c.getContext('2d');
    const W = c.width, H = c.height;
    const end = endingFor(state.battery);
    const sign = state.sign;
    const font = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';

    // 背景: 黄昏 → 夜
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2c2444');
    g.addColorStop(0.45, '#4a3a52');
    g.addColorStop(1, '#171a33');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // 光晕
    const rg = ctx.createRadialGradient(W * 0.72, H * 0.16, 10, W * 0.72, H * 0.16, 300);
    rg.addColorStop(0, 'rgba(255,190,120,.34)');
    rg.addColorStop(1, 'rgba(255,190,120,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

    // 星点
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let i = 0; i < 46; i++) {
      const x = Math.random() * W, y = Math.random() * H * 0.42, r = Math.random() * 1.7 + 0.4;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }

    const PAD = 64;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,.62)';
    ctx.font = '24px ' + font;
    ctx.fillText('下班后的十五分钟', PAD, 116);
    ctx.fillStyle = 'rgba(255,255,255,.42)';
    ctx.font = '20px ' + font;
    ctx.fillText(dateKey(), PAD, 152);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 52px ' + font;
    ctx.fillText('今日情绪结算', PAD, 224);

    // 分隔线
    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, 262); ctx.lineTo(W - PAD, 262); ctx.stroke();

    // 数据
    const rows = [
      ['今日主线', mainline()],
      ['今日份废话', state.waste + ' 字'],
      ['下班仪式', state.acts + ' 次'],
      ['剩余电量', Math.round(state.battery) + '%'],
    ];
    ctx.font = '26px ' + font;
    let y = 322;
    rows.forEach((r) => {
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.fillText(r[0], PAD, y);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 30px ' + font;
      ctx.fillText(r[1], W - PAD - ctx.measureText(r[1]).width, y);
      ctx.font = '26px ' + font;
      y += 62;
    });

    // 电量条
    const barY = y + 8, barW = W - PAD * 2, barH = 12;
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    roundRect(ctx, PAD, barY, barW, barH, 6); ctx.fill();
    const b = Math.round(state.battery);
    const bg = ctx.createLinearGradient(PAD, 0, PAD + barW, 0);
    if (b < 40) { bg.addColorStop(0, '#ff9a76'); bg.addColorStop(1, '#ff6f91'); }
    else { bg.addColorStop(0, '#ffd27a'); bg.addColorStop(1, '#8fd6c0'); }
    ctx.fillStyle = bg;
    roundRect(ctx, PAD, barY, barW * (b / 100), barH, 6); ctx.fill();

    // 今日一签
    let sy = barY + 84;
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.font = '22px ' + font;
    ctx.fillText('今日一签', PAD, sy);
    sy += 40;
    ctx.fillStyle = '#fff';
    ctx.font = '29px ' + font;
    sy = wrapText(ctx, '「' + sign + '」', PAD, sy, W - PAD * 2, 44, 3);

    // 结尾（按流排版: 先量行数, 必要时收紧行距, 绝不压到页脚）
    const FOOT_Y = H - 96;                 // 页脚基线
    const maxW = W - PAD * 2;
    sy += 34;
    ctx.fillStyle = '#ffd9a8';
    ctx.font = 'bold 28px ' + font;
    ctx.fillText(end.title, PAD, sy);
    sy += 44;
    ctx.fillStyle = 'rgba(255,255,255,.86)';
    ctx.font = '26px ' + font;
    const countLines = (t) => Math.max(1, Math.ceil(ctx.measureText(t).width / maxW));
    let need = 0;
    end.lines.forEach((l) => { need += countLines(l); });
    let lineH = 40, gap = 6;
    const space = FOOT_Y - 26 - sy;
    if (need * (lineH + gap) > space) { lineH = 34; gap = 3; }
    if (need * (lineH + gap) > space) { lineH = 29; gap = 0; }
    end.lines.forEach((l) => { sy = wrapText(ctx, l, PAD, sy, maxW, lineH, 3); sy += gap; });

    // 页脚
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.font = '23px ' + font;
    ctx.fillText('现在，请把手机扣过去。', PAD, Math.max(sy + 30, FOOT_Y));

    // 品牌角标
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.font = '20px ' + font;
    ctx.fillText('下班后的十五分钟', W - PAD, H - 56);
    ctx.textAlign = 'left';
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------------- 存档 ---------------- */
  function saveState() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        date: dateKey(), battery: state.battery, waste: state.waste,
        acts: state.acts, picks: state.picks,
      }));
    } catch (e) { /* 隐私模式：忽略 */ }
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || s.date !== dateKey()) return null;
      return s;
    } catch (e) { return null; }
  }

  /* ---------------- 声音开关 ---------------- */
  function initSound() {
    if (!el.sound || !A) return;
    el.sound.addEventListener('click', () => {
      ensureAudio();
      const m = A.setMuted(!A.muted);
      el.sound.setAttribute('aria-pressed', String(m));
      el.sound.textContent = m ? '🔇' : '🔊';
      el.sound.classList.toggle('off', m);
    });
  }

  /* ---------------- 键盘可达 ---------------- */
  function initKeys() {
    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      // Esc: 收起放大的卡片
      if (e.key === 'Escape' && document.body.classList.contains('card-zoom')) {
        document.body.classList.remove('card-zoom');
        e.preventDefault();
        return;
      }
      // 1 / 2 / 3（也接受 A / B / C）选择选项
      const key = String(e.key || '').toLowerCase();
      const order = ['1', '2', '3', 'a', 'b', 'c'];
      if (order.indexOf(key) >= 0) {
        const opts = $$('#options .opt');
        const idx = order.indexOf(key) % 3;
        if (opts[idx] && !opts[idx].disabled) { e.preventDefault(); opts[idx].click(); }
        return;
      }
      // 回车: 推进
      if (e.key === 'Enter' && state.screen !== 'lobby' && state.screen !== 'result') {
        const next = $('#options .cta.next');
        if (next) { e.preventDefault(); next.click(); }
      }
    });
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    state.sign = C.DAILY_SIGNS[hashDay(dateKey()) % C.DAILY_SIGNS.length];
    state.tip = C.TIPS[hashDay(dateKey() + 'tip') % C.TIPS.length];
    renderLobby();
    initSound();
    initKeys();
    // 首次任意点击解锁音频
    const unlock = () => { ensureAudio(); document.removeEventListener('pointerdown', unlock); };
    document.addEventListener('pointerdown', unlock);
  }

  window.__SELFTEST__ = async function () {
    const c = document.querySelector('#card');
    const out = {
      screen: state.screen,
      battery: state.battery,
      waste: state.waste,
      acts: state.acts,
      stages: C.STAGES.length,
      sign: state.sign,
      audioEngine: !!window.audio,
      canvas: c ? { w: c.width, h: c.height } : null,
      hasLocalStorage: (function () { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; } })(),
    };
    // 离线渲染一段音频, 确认真的能出声且不削波、底垫不漂移
    if (window.audio && window.audio.selftest) {
      try { out.audio = await window.audio.selftest(); }
      catch (e) { out.audio = { ok: false, error: String(e && e.message || e) }; }
    }
    return out;
  };
  window.__WRAPCHECK__ = function () {
    // 用真实 canvas 度量, 检查卡片上的每一句会不会出现"标点落在行首"
    const c = document.createElement('canvas');
    c.width = 720; c.height = 1080;
    const ctx = c.getContext('2d');
    ctx.font = '29px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    const maxW = 720 - 64 * 2;
    const texts = [];
    C.DAILY_SIGNS.forEach((s) => texts.push('「' + s + '」'));
    Object.keys(C.ENDINGS).forEach((k) => {
      texts.push(C.ENDINGS[k].title);
      C.ENDINGS[k].lines.forEach((l) => texts.push(l));
    });
    C.TOMORROW.forEach((l) => texts.push(l));
    const bad = [];
    texts.forEach((t) => {
      wrapLog.length = 0;
      wrapText(ctx, t, 64, 100, maxW, 44, 3);
      wrapLog.forEach((line) => {
        if (line && CLOSE_PUNCT.indexOf(line.charAt(0)) >= 0) bad.push(line);
      });
    });
    return { checked: texts.length, bad: bad, ok: bad.length === 0 };
  };
  window.__GOTO__ = function (i) {
    const target = Math.max(0, Math.min(C.STAGES.length - 1, (i || 1) - 1));
    state.idx = target - 1;
    state.rewarded = false;
    nextStage();
  };
  window.__CHOOSE__ = function (i) {
    const st = C.STAGES[state.idx];
    const op = st.options[i];
    const btn = document.querySelectorAll('#options .opt')[i];
    if (op && btn) choose(st, op, btn);
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
